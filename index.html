<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="店铺日账">
<title>店铺日账</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 加载中 -->
<section id="s-loading" class="screen center-screen">
  <div class="logo">账</div>
  <div class="muted">加载中…</div>
</section>

<!-- 未配置 -->
<section id="s-config" class="screen center-screen" hidden>
  <div class="logo">账</div>
  <p>还没配置 Firebase。<br>请按「使用说明」把配置填进 <b>config.js</b>。</p>
</section>

<!-- 登录 -->
<section id="s-login" class="screen" hidden>
  <div class="hero">
    <div class="logo">账</div>
    <h1>店铺日账</h1>
    <p class="muted">每日营业额 · 多台手机一起记</p>
  </div>
  <div class="card">
    <button class="btn google" id="btn-google"><span class="g">G</span> 用 Google 账号登录</button>
    <div class="or"><span>或用邮箱</span></div>
    <input id="in-email" type="email" placeholder="邮箱" autocomplete="email">
    <input id="in-pw" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <button class="btn" id="btn-login">登录</button>
    <div class="links">
      <a id="lnk-register">没有账号？注册</a>
      <a id="lnk-forgot">忘记密码</a>
    </div>
  </div>
</section>

<!-- 创建 / 加入店铺 -->
<section id="s-setup" class="screen" hidden>
  <div class="hero small">
    <h1>开始使用</h1>
    <p class="muted">店主新建店铺，家人和店员用邀请码加入</p>
  </div>
  <div class="seg" id="setup-seg">
    <button data-m="create" class="on">我是店主，新建店铺</button>
    <button data-m="join">用邀请码加入</button>
  </div>
  <div class="card">
    <label class="field" id="f-shopname"><span>店名</span><input id="in-shopname" placeholder="填写店名" maxlength="40"></label>
    <label class="field" id="f-code" hidden><span>邀请码</span><input id="in-code" placeholder="6 位，店主给的" maxlength="6" autocapitalize="characters" autocomplete="off"></label>
    <label class="field"><span>你的名字</span><input id="in-myname" placeholder="填写你的名字" maxlength="20"></label>
  </div>
  <button class="btn wide" id="btn-setup">创建店铺</button>
  <p class="center muted small">当前账号：<span id="setup-email"></span> · <a id="lnk-logout1">换个账号</a></p>
  <p class="center small" id="setup-back" hidden><a>‹ 返回我的店铺</a></p>
</section>

<!-- 主界面 -->
<section id="s-app" class="screen" hidden>
  <header class="topbar">
    <button class="shopname" id="hdr-shop"><span id="hdr-shop-name"></span><i id="hdr-caret">▾</i></button>
    <div class="sync" id="hdr-sync"></div>
  </header>

  <!-- 记账 -->
  <main id="v-entry" class="view">
    <div class="card datecard">
      <div class="datebar">
        <button class="arrow" id="d-prev" aria-label="前一天">‹</button>
        <label class="datepick">
          <span id="d-text"></span>
          <input type="date" id="in-date">
        </label>
        <button class="arrow" id="d-next" aria-label="后一天">›</button>
      </div>
      <div class="chip" id="d-holiday" hidden></div>
      <div class="status" id="d-status"></div>
    </div>

    <div class="card inputs">
      <label class="row"><span>现金</span><input class="amt" id="in-cash" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="next"></label>
      <label class="row"><span>刷卡</span><input class="amt" id="in-card" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="next"></label>
      <label class="row"><span>备注</span><input class="note" id="in-note" placeholder="选填" maxlength="100" enterkeyhint="done"></label>
      <div class="totalrow"><span>合计</span><span class="total"><b id="t-total">0.00</b> lei</span></div>
    </div>

    <button class="btn wide" id="btn-save">保存</button>

    <div class="card cmp full-only">
      <div class="row"><span id="ly-date"></span><span class="val"><b id="ly-val"></b><i class="pct" id="ly-pct"></i></span></div>
      <div class="row"><span id="lw-date"></span><span class="val"><b id="lw-val"></b><i class="pct" id="lw-pct"></i></span></div>
      <div class="row"><span id="mo-cur-t"></span><span class="val"><b id="mo-cur"></b><i class="pct" id="mo-pct"></i></span></div>
      <div class="sub" id="mo-sub"></div>
    </div>

    <div class="links">
      <a id="log-toggle" class="full-only" hidden></a>
      <a id="btn-del" class="danger" hidden>删除这一天</a>
    </div>
    <div class="card full-only" id="card-log" hidden><div id="day-logs"></div></div>
    <p class="hint staff-only">你是店员，只能记今天和昨天的营业额</p>
  </main>

  <!-- 图表 -->
  <main id="v-charts" class="view" hidden>
    <div class="seg" id="scope-seg" hidden>
      <button data-s="shop" class="on">本店</button>
      <button data-s="all" id="scope-all">全部店铺合计</button>
    </div>
    <div class="seg" id="chart-seg">
      <button data-t="day" class="on">日</button>
      <button data-t="week">周</button>
      <button data-t="month">月</button>
      <button data-t="year">年</button>
    </div>
    <div class="card">
      <div class="sumhead">
        <label class="picker" id="pick-month"><input type="month" id="in-month"><span id="month-text"></span> ▾</label>
        <label class="picker" id="pick-year" hidden><select id="in-year"></select><span id="year-text"></span> ▾</label>
      </div>
      <div class="sum">
        <div><div class="label" id="sum-cur-t"></div><div class="big" id="sum-cur"></div></div>
        <div class="right"><div class="label" id="sum-prev-t"></div><div class="prev" id="sum-prev"></div><i class="pct" id="sum-pct"></i></div>
      </div>
      <div class="sub" id="sum-note"></div>
    </div>
    <div class="card">
      <div class="ctitle" id="chart-title"></div>
      <div id="chart-main"></div>
    </div>
    <div class="card cmp" id="card-mvs" hidden>
      <div class="ctitle" id="mvs-title"></div>
      <div class="row"><span id="mvs-cur-t"></span><span class="val"><b id="mvs-cur"></b></span></div>
      <div class="row"><span id="mvs-same-t"></span><span class="val"><b id="mvs-same"></b><i class="pct" id="mvs-pct"></i></span></div>
      <div class="row"><span id="mvs-full-t"></span><span class="val"><b id="mvs-full"></b></span></div>
    </div>
    <div class="card" id="card-wd" hidden>
      <div class="ctitle">星期几日均营业额</div>
      <div class="sub" id="wd-note"></div>
      <div id="chart-wd"></div>
    </div>
    <div class="card list" id="day-list"></div>
    <div class="links center"><a id="btn-export">导出 Excel</a></div>
  </main>

  <!-- 店铺 -->
  <main id="v-shop" class="view" hidden>
    <div class="card shophead">
      <div class="shoptitle"><span id="sh-name"></span> <a id="lnk-rename" hidden>改名</a></div>
      <div class="sub" id="sh-role"></div>
    </div>

    <div class="card full-only invite">
      <div class="label">邀请码</div>
      <div class="code" id="sh-code"></div>
      <div class="btnrow">
        <button class="btn mini" id="btn-invite">复制邀请消息</button>
        <button class="btn mini ghost" id="btn-recode" hidden>换一个</button>
      </div>
      <div class="sub">新加入的人默认是「店员」，可以在下面改成「家人」</div>
    </div>

    <div class="card full-only">
      <div class="label" id="sh-members-t"></div>
      <div id="sh-members"></div>
    </div>

    <div class="card menu">
      <a class="lrow full-only" id="logs-toggle2"><span>最近修改记录</span><i>›</i></a>
      <div id="recent-logs" hidden></div>
      <a class="lrow full-only" id="btn-export2"><span>导出全部数据（Excel）</span><span class="muted" id="sh-count"></span><i>›</i></a>
      <a class="lrow" id="btn-switch"><span>切换 / 新建 / 加入店铺</span><i>›</i></a>
      <a class="lrow danger" id="btn-leave" hidden><span>退出这家店铺</span><i>›</i></a>
      <a class="lrow" id="btn-logout"><span>退出登录</span><span class="muted small" id="sh-email"></span><i>›</i></a>
    </div>
    <p class="hint"><span id="sh-sync"></span></p>
    <p class="hint" id="install-tip"></p>
  </main>

  <nav class="tabbar">
    <button data-v="entry" class="on"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><span>记账</span></button>
    <button data-v="charts" class="full-only"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-5"/><path d="M12 16V6"/><path d="M17 16v-8"/></svg><span>图表</span></button>
    <button data-v="shop"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M5 11v9h14v-9"/><path d="M10 20v-5h4v5"/></svg><span>店铺</span></button>
  </nav>
</section>

<!-- 切换店铺 -->
<div id="sheet" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet-box">
    <div class="ctitle">我的店铺</div>
    <div id="sheet-list"></div>
    <button class="btn light" id="sheet-new">＋ 新建或加入另一家店</button>
    <button class="btn light" id="sheet-close">关闭</button>
  </div>
</div>

<div id="toast" hidden></div>

<script type="module" src="main.js"></script>
</body>
</html>
